name: Deploy Staiging

on:
  push:
    branches: [main]

jobs:
  backend:
    name: Deploy Backend to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 212.85.2.8 >> ~/.ssh/known_hosts

      - name: Criar .env local
        run: |
          cat <<'EOF' > .env.deploy
            PORT=${{ vars.PORT }}
            DB_HOST=${{ vars.DB_HOST }}
            DB_NAME=${{ vars.DB_NAME }}
            DB_USER=${{ vars.DB_USER }}
            DB_PASS=${{ vars.DB_PASS }}
            EMAIL_HOST=smtp.hostinger.com
            EMAIL_PORT=587
            EMAIL_USER=${{ vars.EMAIL_USER }}
            EMAIL_PASS=${{ vars.EMAIL_PASS }}
            JWT_SECRET=${{ vars.JWT_SECRET }}
            PAGARME_SECRET_KEY=${{ secrets.PAGARME_SECRET_KEY }}
            SENSOR_DB_HOST=${{ vars.SENSOR_DB_HOST }}
            SENSOR_DB_PORT=${{ vars.SENSOR_DB_PORT }}
            SENSOR_DB_NAME=${{ vars.SENSOR_DB_NAME }}
            SENSOR_DB_USER=${{ vars.SENSOR_DB_USER }}
            SENSOR_DB_PASS=${{ vars.SENSOR_DB_PASS }}
          EOF

      - name: Envia .env para o servidor
        run: |
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no .env.deploy root@212.85.2.8:/var/www/studio/studio-backend/.env

      - name: Deploy Backend
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@212.85.2.8 << 'EOF'
            cd /var/www/studio/studio-backend
            git pull origin main
            npm install
            npm run build
            pm2 restart studio-backend || pm2 start dist/index.js --name studio-backend
            pm2 save
          EOF