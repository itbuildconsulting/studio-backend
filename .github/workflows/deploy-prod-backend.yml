name: Deploy Backend (production)

on:
  push:
    branches: [release]

jobs:
  backend:
    name: Deploy Backend to VPS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instala dependências e builda no runner
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 212.85.2.8 >> ~/.ssh/known_hosts

      - name: Sincroniza código e node_modules via rsync
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.env*' \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            ./ root@212.85.2.8:/var/www/prod/spingo-backend/

      - name: Criar .env local
        run: |
          cat <<'EOF' > .env.deploy
          PORT=${{ secrets.PORT }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASS=${{ secrets.DB_PASS }}
          EMAIL_HOST=smtp.hostinger.com
          EMAIL_PORT=587
          EMAIL_USER=${{ secrets.EMAIL_USER }}
          EMAIL_PASS=${{ secrets.EMAIL_PASS }}
          EMAIL_FROM_NAME=Spin'go
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          PAGARME_SECRET_KEY=${{ secrets.PAGARME_SECRET_KEY }}
          PAGARME_WEBHOOK_SECRET=${{ secrets.PAGARME_WEBHOOK_SECRET }}
          CRM_ENABLED=true
          SENSOR_DB_HOST=${{ secrets.SENSOR_DB_HOST }}
          SENSOR_DB_PORT=${{ secrets.SENSOR_DB_PORT }}
          SENSOR_DB_NAME=${{ secrets.SENSOR_DB_NAME }}
          SENSOR_DB_USER=${{ secrets.SENSOR_DB_USER }}
          SENSOR_DB_PASS=${{ secrets.SENSOR_DB_PASS }}
          EOF

      - name: Envia .env para o servidor
        run: |
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no .env.deploy root@212.85.2.8:/var/www/prod/spingo-backend/.env

      - name: Reinicia PM2
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@212.85.2.8 << 'EOF'
            set -e
            cd /var/www/prod/spingo-backend
            PORT=4200 NODE_ENV=production pm2 restart spingo-backend-prod --update-env || \
            PORT=4200 NODE_ENV=production pm2 start dist/index.js --name spingo-backend-prod
            pm2 save
          EOF